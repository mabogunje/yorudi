<html>
    <head>
        <meta charset="utf-8">
        <link rel="icon" href="favicon.ico">
        <link rel="stylesheet" href="style.css">
        <script type="text/javascript">
        
            const API = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
                ? `${window.location.origin}/word`
                : "https://yorudi.azurewebsites.net/word";

            function showMessage(view, message) {
                const item = document.createElement("dt");
                item.textContent = message;
                view.replaceChildren(item);
            }

            function appendDefinition(view, index, entry) {
                const word = document.createElement("dt");
                const decomposition = entry.decomposition.map((currentWord) => currentWord.spelling).join(" . ");
                word.textContent = `${index}. ${entry.definition} [ ${decomposition} ]`;
                view.appendChild(word);

                for(let meaning of entry.meanings) {
                    const item = document.createElement("dd");
                    item.textContent = `- ${meaning.description}`;
                    view.appendChild(item);
                }
            }

            async function getDefinitions() {
                const View = document.getElementById("entries") // We will print results into this view

                //Get the parameters of the query from the form
                const dictionary = document.getElementById("dictionaries").value;
                const query = document.getElementById("query").value.trim().toLowerCase();
                const mode = Array.from(document.getElementsByName("lookup")).find((m) => m.checked === true).value;

                if(query.length === 0) {
                    showMessage(View, "Enter a word to search.");
                    return;
                }

                showMessage(View, "Searching...");
                
                //Make the REST request
                const params = new URLSearchParams({ dictionary, mode });
                const URL = `${API}/${encodeURIComponent(query)}?${params.toString()}`;

                try {
                    const response = await fetch(URL);
                    const data = await response.json();

                    if(data['error']) {
                        showMessage(View, data.message);
                    } else {
                        View.replaceChildren();
                        data.forEach((entry, index) => appendDefinition(View, index + 1, entry));
                    }
                } catch(error) {
                    showMessage(View, "Unable to reach the dictionary service.");
                }
            }
        </script>
    </head>
    <body>
        <header class="masthead">
            <div class="brand">
                <img src="logo.jpg" height="50px" width="50px" />
                <strong>Yor&ugrave;d&iacute;</strong>
            </div>
        </header>
        <nav>
            <small>A Standardized & Downloadable Comprehensive Yoruba Multilingual Dictionary</small>
            <a class="github-button" href="https://github.com/mabogunje/yorudi">View on Github</a>
        </nav>
        <div class="container">
            <div class="header">Choose A Dictionary: 
                <select id="dictionaries">
                    <option value="gpt">100 Most Popular Words per Alphabet</option>
                    <option value="cms">Church Missionary Society</option>
                    <option value="names">Yoruba Personal Names</option>
                    <option value="sample">Sample Dictionary</option>
                </select>
            </div>
            <table width="80%" align="center">
                <tr>
                    <td colspan="4">
                        <form action="#" method="get" onsubmit="getDefinitions(); return false;">
                            <input id="query" type="text" placeholder="Search with Yor&ugrave;b&aacute; with or without tone marks">
                        </form>
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="radio" id="lookup" name="lookup" value="match" checked="checked"> <label for="lookup">Word Lookup</label>
                    </td>
                    <td>
                        <input type="radio" id="strict" name="lookup" value="strict"> <label for="strict">Strict Word Lookup</label>
                    </td>
                    <td>
                        <input type="radio" id="related" name="lookup" value="related"> <label for="related">Related Words Lookup</label>
                    </td>
                    <td>
                        <input type="radio" id="derived" name="lookup" value="derivative"> <label for="derived">Derivative Words Lookup</label>
                    </td>
                </tr>
            </table>
            <hr/>
            <div id="results">
                <dl id="entries">

                </dl>
            </div>
        </div>
    </body>
</html>
